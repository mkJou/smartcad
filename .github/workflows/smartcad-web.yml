# SmartCAD: compila la versión web (wasm) y la deja como artefacto.
# El despliegue a Cloudflare Pages se hace aparte (wrangler pages deploy).
name: SmartCAD web build

on:
  push:
    branches: [smartcad]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartcad-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install trunk
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: trunk

      - name: Read wasm-bindgen version
        id: wbg
        run: |
          VERSION=$(sed -n '/name = "wasm-bindgen"/{n;s/version = "\(.*\)"/\1/p;q;}' Cargo.lock)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}

      - name: Build web bundle (served from /)
        run: trunk build --locked --release --public-url / --dist dist/app --html-output index.html web-app.html

      - name: Stamp the service worker cache version
        run: |
          test -f dist/app/sw.js
          hash=$(find dist/app -type f ! -name sw.js -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c 1-12)
          sed -i "s/^const CACHE_VERSION = \"[^\"]*\";/const CACHE_VERSION = \"$hash\";/" dist/app/sw.js

      - name: Cloudflare Pages headers (COOP/COEP → SharedArrayBuffer)
        run: |
          printf '%s\n' '/*' \
            '  Cross-Origin-Opener-Policy: same-origin' \
            '  Cross-Origin-Embedder-Policy: require-corp' \
            '  X-Content-Type-Options: nosniff' > dist/app/_headers
          echo '[]' > dist/app/supporters.json
          jq -n --arg commit "$GITHUB_SHA" '{product: "SmartCAD", commit: $commit, source: "https://github.com/mkJou/smartcad"}' > dist/app/release.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smartcad-web
          path: dist/app
          retention-days: 14
